<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Intérprete Simultáneo en Vivo (ENG ⇄ SPA)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    /* Regla Estricta: Tipografía obligatoria para todo texto hablado */
    .strict-font-12 {
      font-size: 12px !important;
      line-height: 1.55 !important;
    }

    /* Ocultar barra de desplazamiento manteniendo funcionalidad */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Historial: desplazamiento vertical visible cuando hay muchas interacciones; lo nuevo aparece arriba */
    .transcript-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(100, 116, 139, 0.85) rgba(15, 23, 42, 0.45);
      overscroll-behavior-y: contain;
    }
    .transcript-scroll::-webkit-scrollbar { width: 8px; }
    .transcript-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.45); border-radius: 8px; }
    .transcript-scroll::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.85); border-radius: 8px; }
    .transcript-scroll::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.95); }

    /* Pulsos visuales para los estados de escucha */
    @keyframes pulse-ring-blue {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(59, 130, 246, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    
    @keyframes pulse-ring-green {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .listening-pulse-blue {
      animation: pulse-ring-blue 1.4s infinite cubic-bezier(0.24, 0, 0.38, 1);
    }

    .listening-pulse-green {
      animation: pulse-ring-green 1.4s infinite cubic-bezier(0.24, 0, 0.38, 1);
    }

    /* Animación de ondas para indicador en vivo */
    @keyframes wave-bars {
      0%, 100% { height: 6px; }
      50% { height: 20px; }
    }
    .wave-bar {
      animation: wave-bars 0.8s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 font-sans select-none overflow-hidden">

  <header class="w-full shrink-0 bg-slate-900/90 backdrop-blur border-b border-slate-800/80 px-3 py-2.5 flex items-center justify-between z-20">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
        <i class="ph ph-translate text-lg"></i>
      </div>
      <div>
        <h1 class="text-xs font-bold tracking-wider uppercase text-slate-200 flex items-center gap-1.5">
          <span>INTERPRETER PRO</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded bg-indigo-500/20 text-indigo-300 font-mono">ENG ⇄ SPA</span>
        </h1>
        <p class="text-[10px] text-slate-400 flex items-center gap-1">
          <span id="headerEngineStatus" class="inline-block w-1.5 h-1.5 rounded-full bg-slate-500"></span>
          <span id="headerEngineLabel">Audio en Espera (Pulsa START)</span>
        </p>
      </div>
    </div>

    <!-- Indicadores de sistema -->
    <div class="flex items-center gap-1.5">
      <div id="audioUnlockedBadge" class="hidden items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-[10px] text-emerald-400 font-medium">
        <i class="ph-bold ph-speaker-high"></i>
        <span>AUDIO ON</span>
      </div>
      <div id="activeVoiceBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 font-mono hidden md:inline-block">
        Voz: Auto
      </div>
    </div>
  </header>

  <!-- Área de texto principal: top-to-bottom estricto -->
  <main class="flex-1 flex flex-col min-h-0 relative overflow-hidden bg-slate-950">
    <div id="transcriptScrollContainer" class="flex-1 overflow-y-auto px-3 py-3 space-y-2.5 scroll-smooth transcript-scroll">
      
      <!-- Mensaje Inicial de bienvenida cuando está vacío -->
      <div id="emptyStateNotice" class="text-center py-10 px-4 flex flex-col items-center justify-center text-slate-500">
        <div class="w-12 h-12 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-600 mb-3">
          <i class="ph ph-waveform text-2xl"></i>
        </div>
        <p class="text-xs font-medium text-slate-400 mb-1">Motor de traducción simultánea listo</p>
        <p class="text-[11px] text-slate-500 max-w-xs leading-relaxed">
          Toca <span class="text-indigo-400 font-semibold">START</span> para activar el subsistema de sonido. Luego usa los controles inferiores para hablar en Inglés o Español.
        </p>
      </div>

      <!-- Contenedor del historial: las interacciones más recientes aparecen arriba -->
      <div id="conversationStream" class="flex flex-col space-y-2.5 w-full"></div>

      <!-- Tarjeta en vivo del habla actual (interina) -->
      <div id="liveInputCard" class="hidden w-full rounded-lg bg-slate-900/90 border border-indigo-500/30 p-2.5 shadow-lg transition-all">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-1.5">
            <span id="liveInputBadge" class="text-[10px] font-bold px-1.5 py-0.5 rounded tracking-wide uppercase"></span>
            <span id="liveInputStatus" class="text-[10px] text-slate-400">Escuchando en tiempo real...</span>
          </div>
          <!-- Ondas de audio simuladas -->
          <div class="flex items-center gap-0.5 h-4">
            <span class="w-1 bg-indigo-400 rounded-full wave-bar"></span>
            <span class="w-1 bg-indigo-400 rounded-full wave-bar"></span>
            <span class="w-1 bg-indigo-400 rounded-full wave-bar"></span>
          </div>
        </div>
        <p id="liveInputText" class="strict-font-12 text-slate-200 font-normal italic tracking-normal break-words"></p>
      </div>

      <!-- Espaciador final para evitar que el dock cubra el contenido -->
      <div class="h-24 shrink-0"></div>
    </div>

    <!-- Mensaje flotante de notificación (Toast / Error) -->
    <div id="appToast" class="absolute top-2 left-1/2 -translate-x-1/2 z-30 px-3 py-1.5 rounded-lg bg-slate-900/95 border border-slate-700 text-[11px] text-slate-200 shadow-xl opacity-0 pointer-events-none transition-all duration-200 flex items-center gap-1.5">
      <i id="toastIcon" class="ph ph-info text-indigo-400 text-sm"></i>
      <span id="toastMsg">Mensaje</span>
    </div>
  </main>

  <!-- Dock Inferior Fijo: 100% guiado por tacto y voz, sin campos de entrada manual -->
  <footer class="w-full shrink-0 bg-slate-900/95 border-t border-slate-800 backdrop-blur-lg p-2.5 z-20">
    <div class="max-w-xl mx-auto flex items-center gap-2">
      
      <!-- Botón 1: START (Desbloquea AudioContext y limpia historial) -->
      <button 
        id="btnStart"
        type="button" 
        class="flex flex-col items-center justify-center min-w-[70px] h-[58px] px-2 rounded-xl bg-slate-800 hover:bg-slate-750 active:scale-95 border border-slate-700 text-slate-200 transition-all focus:outline-none"
        title="Desbloquear audio e iniciar nueva sesión"
      >
        <i id="startIcon" class="ph-bold ph-power text-lg text-indigo-400"></i>
        <span class="text-[10px] font-bold mt-0.5 tracking-wider">START</span>
      </button>

      <!-- Botón 2: ENG - SPA (Toggle de escucha en inglés y traducción a español) -->
      <button 
        id="btnEngSpa"
        type="button"
        disabled
        class="flex-1 h-[58px] px-3 rounded-xl bg-slate-800/80 border border-blue-500/30 text-blue-300 font-semibold transition-all flex flex-col items-center justify-center relative overflow-hidden focus:outline-none active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none"
      >
        <div class="flex items-center gap-1.5 text-xs font-bold">
          <i id="engIcon" class="ph-bold ph-microphone text-sm"></i>
          <span id="engLabel">ENG ➔ SPA</span>
        </div>
        <span id="engSublabel" class="text-[9px] font-normal text-blue-300/80">Toca para hablar en Inglés</span>
      </button>

      <!-- Botón 3: SPA - ENG (Toggle de escucha en español y traducción a inglés) -->
      <button 
        id="btnSpaEng"
        type="button"
        disabled
        class="flex-1 h-[58px] px-3 rounded-xl bg-slate-800/80 border border-emerald-500/30 text-emerald-300 font-semibold transition-all flex flex-col items-center justify-center relative overflow-hidden focus:outline-none active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none"
      >
        <div class="flex items-center gap-1.5 text-xs font-bold">
          <i id="spaIcon" class="ph-bold ph-microphone text-sm"></i>
          <span id="spaLabel">SPA ➔ ENG</span>
        </div>
        <span id="spaSublabel" class="text-[9px] font-normal text-emerald-300/80">Toca para hablar en Español</span>
      </button>

    </div>
  </footer>

  <script>
    /* ==========================================================================
       ESTADOS Y VARIABLES NÚCLEO
       ========================================================================== */
    const apiKey = ""; // API key proporcionada en runtime por el entorno
    let audioCtx = null;
    let isAudioUnlocked = false;

    // Estados del Speech-to-Text (STT)
    let isUserListening = false;
    let activeDirection = null; // 'en-es' | 'es-en'
    let recognition = null;
    let restartTimeout = null;
    let isIntentionalStop = false;
    let recognitionSessionId = 0;

    // Búferes acumulativos inmutables (Previene cortes en Chromium / Android)
    let completedChunks = [];
    let currentSessionFinalText = "";
    let currentSessionInterimText = "";

    // Controlador de concurrencia para Gemini
    let activeAbortController = null;

    // Catálogo de voces para TTS
    let availableVoices = [];

    // Anclaje global para evitar recolección de basura V8 en TTS
    window._activeUtterance = null;
    window._activeUtterances = [];

    const headerEngineStatus = document.getElementById('headerEngineStatus');
    const headerEngineLabel = document.getElementById('headerEngineLabel');
    const audioUnlockedBadge = document.getElementById('audioUnlockedBadge');
    const activeVoiceBadge = document.getElementById('activeVoiceBadge');
    
    const transcriptScrollContainer = document.getElementById('transcriptScrollContainer');
    const conversationStream = document.getElementById('conversationStream');
    const emptyStateNotice = document.getElementById('emptyStateNotice');
    const liveInputCard = document.getElementById('liveInputCard');
    const liveInputBadge = document.getElementById('liveInputBadge');
    const liveInputText = document.getElementById('liveInputText');
    
    const btnStart = document.getElementById('btnStart');
    const startIcon = document.getElementById('startIcon');
    
    const btnEngSpa = document.getElementById('btnEngSpa');
    const engIcon = document.getElementById('engIcon');
    const engLabel = document.getElementById('engLabel');
    const engSublabel = document.getElementById('engSublabel');
    
    const btnSpaEng = document.getElementById('btnSpaEng');
    const spaIcon = document.getElementById('spaIcon');
    const spaLabel = document.getElementById('spaLabel');
    const spaSublabel = document.getElementById('spaSublabel');
    
    const appToast = document.getElementById('appToast');
    const toastMsg = document.getElementById('toastMsg');
    const toastIcon = document.getElementById('toastIcon');

    /**
     * Inicializa y desbloquea el subsistema de audio (AudioContext y SpeechSynthesis)
     * Resuelve restricciones de autoplay en navegadores Chromium.
     */
    function unlockAudioSubsystem() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        // Cebado de SpeechSynthesis con una locución vacía en volumen 0
        if ('speechSynthesis' in window) {
          window.speechSynthesis.getVoices();
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          const dummy = new SpeechSynthesisUtterance('');
          dummy.volume = 0;
          window.speechSynthesis.speak(dummy);
        }

        isAudioUnlocked = true;
        audioUnlockedBadge.classList.remove('hidden');
        audioUnlockedBadge.classList.add('flex');
        headerEngineStatus.className = "inline-block w-1.5 h-1.5 rounded-full bg-emerald-400";
        headerEngineLabel.textContent = "Sistema de Audio Listo";
        
        btnEngSpa.disabled = false;
        btnSpaEng.disabled = false;
        
        playMicroFeedback(880, 0.08);
        showToast("Audio y síntesis desbloqueados", "ph-check-circle text-emerald-400");
      } catch (err) {
        console.warn("Audio unlock warning:", err);
      }
    }

    /**
     * Retroalimentación inmediata: Micro-tono de 80ms vía AudioContext y vibración de 35ms
     */
    function playMicroFeedback(freq = 660, duration = 0.08) {
      // Vibración de 35 ms
      if (navigator.vibrate) {
        try {
          navigator.vibrate(35);
        } catch (_) {}
      }

      // Micro-tono auditivo sintético
      try {
        if (audioCtx && audioCtx.state === 'running') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        }
      } catch (e) {
        console.warn("Micro feedback tone error:", e);
      }
    }

    /**
     * Carga y filtra voces dando prioridad estricta a voces locales/offline
     */
    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      if (availableVoices.length > 0) {
        activeVoiceBadge.textContent = `${availableVoices.length} Voces Disponibles`;
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    /**
     * Obtiene la voz óptima para el dialecto objetivo, priorizando localService
     */
    function getOptimalVoice(targetLangPrefix) {
      if (!availableVoices.length && 'speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }

      const matchingVoices = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith(targetLangPrefix.toLowerCase()));
      if (!matchingVoices.length) return null;

      // 1. Prioridad: Local / Offline service
      const localVoice = matchingVoices.find(v => v.localService === true);
      if (localVoice) return localVoice;

      // 2. Prioridad: Voces empaquetadas naturales
      const naturalVoice = matchingVoices.find(v => /natural|enhanced|premium|google|microsoft/i.test(v.name));
      if (naturalVoice) return naturalVoice;

      // 3. Fallback: Primera voz encontrada
      return matchingVoices[0];
    }

    /**
     * Motor TTS: Reproducción fluida sin cortes ni demoras acumuladas
     */
    function speakTranslation(text, targetLangPrefix) {
      if (!('speechSynthesis' in window) || !text) return;

      // REGLA: Cancelación Condicional Únicamente
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
      }
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }

      // REGLA: Cero fraccionamiento por comas; enviar el texto completo en un único Utterance
      const utterance = new SpeechSynthesisUtterance(text);
      const optimalVoice = getOptimalVoice(targetLangPrefix);

      if (optimalVoice) {
        utterance.voice = optimalVoice;
        // REGLA: Sincronización Estricta del Dialecto
        utterance.lang = optimalVoice.lang;
      } else {
        utterance.lang = targetLangPrefix.startsWith('es') ? 'es-ES' : 'en-US';
      }

      utterance.rate = 1.05; // Ritmo ágil para interpretación simultánea
      utterance.pitch = 1.0;

      // REGLA: Protección contra V8 Garbage Collection
      window._activeUtterance = utterance;
      window._activeUtterances = [utterance];

      utterance.onend = () => {
        window._activeUtterance = null;
        window._activeUtterances = [];
      };

      utterance.onerror = (e) => {
        console.warn("TTS Error:", e);
        window._activeUtterance = null;
        window._activeUtterances = [];
      };

      window.speechSynthesis.speak(utterance);
    }

    /**
     * Construye una instancia segura de SpeechRecognition adaptada a Chromium/Android
     */
    function createRecognitionInstance(langCode, sessionId) {
      const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognitionClass) {
        showToast("SpeechRecognition no soportado en este navegador", "ph-warning text-amber-400");
        return null;
      }

      const rec = new SpeechRecognitionClass();
      rec.continuous = true;
      // DIAGNÓSTICO STT: solo resultados finales para reducir duplicaciones en Android.
      rec.interimResults = false;
      rec.lang = langCode;
      rec.maxAlternatives = 1;

      rec.onresult = (event) => {
        let sessionFinal = "";
        let sessionInterim = "";

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const item = event.results[i];
          const transcript = item[0].transcript;
          if (item.isFinal) {
            sessionFinal += transcript + " ";
          } else {
            sessionInterim += transcript;
          }
        }

        if (sessionFinal) {
          currentSessionFinalText += sessionFinal;
        }
        currentSessionInterimText = sessionInterim;
        
        // Actualizar tarjeta en vivo
        renderLiveInput();
      };

      rec.onerror = (event) => {
        // En Android, 'no-speech' es común en pausas; no interrumpir si el usuario aún escucha
        if (event.error === 'no-speech' || event.error === 'audio-capture') {
          return;
        }
        console.warn("STT warning:", event.error);
      };

      rec.onend = () => {
        // Ignorar eventos tardíos de una sesión anterior. En Android/Chrome,
        // abort() puede generar onend después de que ya comenzamos otra sesión.
        if (sessionId !== recognitionSessionId || rec !== recognition) return;
        if (isIntentionalStop || !isUserListening) return;

        // Android/Chrome puede cerrar SpeechRecognition después de una pausa
        // aunque continuous=true. Mantener la sesión activa y reanudarla
        // automáticamente, sin borrar el texto ya reconocido.
        clearTimeout(restartTimeout);
        restartTimeout = setTimeout(() => {
          if (sessionId !== recognitionSessionId || rec !== recognition) return;
          if (isIntentionalStop || !isUserListening) return;

          try {
            // Primero intentamos reutilizar la misma instancia para evitar
            // perder contexto y reducir repeticiones al cambiar de instancia.
            rec.start();
            recognition = rec;
          } catch (err) {
            // Si Chrome/Android no permite reutilizarla, crear una instancia
            // nueva conservando los buffers de texto existentes.
            try {
              recognition = createRecognitionInstance(langCode, sessionId);
              if (recognition) recognition.start();
            } catch (restartErr) {
              console.warn("STT restart warning:", restartErr);
              isUserListening = false;
              resetDockButtons();
            }
          }
        }, 250);
      };

      return rec;
    }

    /**
     * Muestra el texto en vivo que el usuario está diciendo
     */
    function renderLiveInput() {
      const parts = [...completedChunks];
      if (currentSessionFinalText) parts.push(currentSessionFinalText);
      if (currentSessionInterimText) parts.push(currentSessionInterimText);
      
      const fullText = parts.join(" ").trim();
      if (fullText) {
        liveInputText.textContent = fullText;
        liveInputCard.classList.remove('hidden');
        scrollToBottom();
      }
    }

    /**
     * Agrega una interacción terminada al historial, manteniendo orden
     * cronológico de arriba hacia abajo.
     */
    function appendTranscriptEntry(text, direction) {
      if (!text) return;

      emptyStateNotice.classList.add('hidden');

      const entry = document.createElement('div');
      entry.className = 'w-full rounded-lg bg-slate-900/80 border border-slate-800 p-2.5 shadow-sm';

      const header = document.createElement('div');
      header.className = 'flex items-center gap-1.5 mb-1.5';

      const badge = document.createElement('span');
      badge.className = direction === 'en-es'
        ? 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/20'
        : 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/20';
      badge.textContent = direction === 'en-es' ? 'ENG (ORIGINAL)' : 'SPA (ORIGINAL)';

      const status = document.createElement('span');
      status.className = 'text-[10px] text-slate-500';
      status.textContent = 'Interacción finalizada';

      header.appendChild(badge);
      header.appendChild(status);

      const source = document.createElement('p');
      source.className = 'strict-font-12 text-slate-200 font-normal break-words whitespace-pre-wrap';
      source.textContent = text;

      entry.appendChild(header);
      entry.appendChild(source);
      conversationStream.appendChild(entry);

      // Mantener siempre visible la interacción más reciente.
      transcriptScrollContainer.scrollTop = transcriptScrollContainer.scrollHeight;
    }

    /**
     * Inicia la escucha en el idioma indicado
     */
    function startListening(direction) {
      if (!isAudioUnlocked) unlockAudioSubsystem();
      playMicroFeedback(750, 0.08);

      // Cerrar/invalidate cualquier reconocimiento anterior antes de iniciar
      // una nueva interacción. Esto evita dos SpeechRecognition simultáneos.
      recognitionSessionId++;
      const sessionId = recognitionSessionId;
      if (recognition) {
        try { recognition.abort(); } catch (_) {}
      }
      recognition = null;

      isUserListening = true;
      activeDirection = direction;
      isIntentionalStop = false;
      completedChunks = [];
      currentSessionFinalText = "";
      currentSessionInterimText = "";
      emptyStateNotice.classList.add('hidden');

      const langCode = direction === 'en-es' ? 'en-US' : 'es-ES';
      recognition = createRecognitionInstance(langCode, sessionId);

      // Actualizar UI del dock según el botón activo
      if (direction === 'en-es') {
        btnEngSpa.className = "flex-1 h-[58px] px-3 rounded-xl bg-blue-600 text-white font-bold transition-all flex flex-col items-center justify-center relative overflow-hidden focus:outline-none listening-pulse-blue ring-2 ring-blue-400";
        engIcon.className = "ph-bold ph-record text-base text-red-200 animate-pulse";
        engLabel.textContent = "ESCUCHANDO EN";
        engSublabel.textContent = "Toca para Detener y Traducir";
        
        btnSpaEng.disabled = true;
        btnSpaEng.classList.add('opacity-30', 'pointer-events-none');
        
        liveInputBadge.className = "text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-500/30 text-blue-300";
        liveInputBadge.textContent = "ENG (ORIGINAL)";
      } else {
        btnSpaEng.className = "flex-1 h-[58px] px-3 rounded-xl bg-emerald-600 text-white font-bold transition-all flex flex-col items-center justify-center relative overflow-hidden focus:outline-none listening-pulse-green ring-2 ring-emerald-400";
        spaIcon.className = "ph-bold ph-record text-base text-red-200 animate-pulse";
        spaLabel.textContent = "ESCUCHANDO ES";
        spaSublabel.textContent = "Toca para Detener y Traducir";
        
        btnEngSpa.disabled = true;
        btnEngSpa.classList.add('opacity-30', 'pointer-events-none');
        
        liveInputBadge.className = "text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/30 text-emerald-300";
        liveInputBadge.textContent = "SPA (ORIGINAL)";
      }

      liveInputText.textContent = "...";
      liveInputCard.classList.remove('hidden');

      try {
        if (recognition) recognition.start();
      } catch (err) {
        console.warn("Recognition start warning:", err);
      }
    }

    /**
     * Detención inmediata sin esperas artificiales y activación de Gemini
     */
    async function stopListeningAndTranslate() {
      playMicroFeedback(440, 0.08);

      const direction = activeDirection;
      isIntentionalStop = true;
      isUserListening = false;
      clearTimeout(restartTimeout);
      recognitionSessionId++; // invalida cualquier onend tardío


      // Extraer de inmediato todo el texto acumulado sin perder palabras
      const allTextParts = [...completedChunks, currentSessionFinalText, currentSessionInterimText];
      const speechText = allTextParts.filter(Boolean).join(" ").trim();

      // Abortar limpiamente STT
      if (recognition) {
        try {
          recognition.abort();
        } catch (_) {}
        recognition = null;
      }

      // PRUEBA STT: conservar y mostrar el texto reconocido.
      // La llamada a Gemini queda temporalmente desactivada para aislar el problema.
      liveInputCard.classList.remove('hidden');
      liveInputBadge.textContent = "TEXTO DETECTADO";
      if (liveInputStatus) liveInputStatus.textContent = "Escucha finalizada";
      liveInputBadge.className = "text-[10px] font-bold px-1.5 py-0.5 rounded tracking-wide uppercase bg-amber-500/20 text-amber-300 border border-amber-500/30";
      liveInputText.classList.remove('italic');
      liveInputText.classList.add('font-semibold');
      liveInputText.textContent = speechText || "(sin texto reconocido)";

      // Guardar esta interacción en el historial para que las siguientes
      // aparezcan debajo, en orden cronológico.
      if (speechText) {
        appendTranscriptEntry(speechText, direction);
      }

      resetDockButtons();

      if (!speechText) {
        showToast("No se detectó habla", "ph-warning text-amber-400");
      } else {
        showToast("Prueba de reconocimiento: traducción desactivada", "ph-info text-amber-400");
      }

      // IMPORTANTE: no llamar a executeTranslation() en esta versión de diagnóstico.
      return;
    }

    /**
     * Muestra el estado "Traduciendo..." inmediato en el botón pulsado
     */
    function setTranslatingState(direction) {
      if (direction === 'en-es') {
        btnEngSpa.className = "flex-1 h-[58px] px-3 rounded-xl bg-amber-500/20 border border-amber-500/50 text-amber-300 font-bold transition-all flex flex-col items-center justify-center focus:outline-none pointer-events-none";
        engIcon.className = "ph-bold ph-spinner animate-spin text-base text-amber-400";
        engLabel.textContent = "Traduciendo...";
        engSublabel.textContent = "Gemini 3 Flash";
      } else {
        btnSpaEng.className = "flex-1 h-[58px] px-3 rounded-xl bg-amber-500/20 border border-amber-500/50 text-amber-300 font-bold transition-all flex flex-col items-center justify-center focus:outline-none pointer-events-none";
        spaIcon.className = "ph-bold ph-spinner animate-spin text-base text-amber-400";
        spaLabel.textContent = "Traduciendo...";
        spaSublabel.textContent = "Gemini 3 Flash";
      }
    }

    /**
     * Restaura los botones del dock a su estado habilitado en reposo
     */
    function resetDockButtons() {
      activeDirection = null;
      
      btnEngSpa.className = "flex-1 h-[58px] px-3 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-blue-500/30 text-blue-300 font-semibold transition-all flex flex-col items-center justify-center relative overflow-hidden focus:outline-none active:scale-[0.98]";
      engIcon.className = "ph-bold ph-microphone text-sm";
      engLabel.textContent = "ENG ➔ SPA";
      engSublabel.textContent = "Toca para hablar en Inglés";
      btnEngSpa.disabled = false;
      btnEngSpa.classList.remove('opacity-30', 'pointer-events-none');

      btnSpaEng.className = "flex-1 h-[58px] px-3 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-emerald-500/30 text-emerald-300 font-semibold transition-all flex flex-col items-center justify-center relative overflow-hidden focus:outline-none active:scale-[0.98]";
      spaIcon.className = "ph-bold ph-microphone text-sm";
      spaLabel.textContent = "SPA ➔ ENG";
      spaSublabel.textContent = "Toca para hablar en Español";
      btnSpaEng.disabled = false;
      btnSpaEng.classList.remove('opacity-30', 'pointer-events-none');
    }

    /**
     * Motor de Traducción: Gemini 3 Flash con Zero-Shot Conversational
     * NOTA: executeTranslation() se conserva, pero no se invoca en esta versión de diagnóstico.
     */
    async function executeTranslation(originalSpeech, direction) {
      // Control de concurrencia: Cancelar petición en vuelo previa
      if (activeAbortController) {
        activeAbortController.abort();
      }
      activeAbortController = new AbortController();

      const isToSpanish = direction === 'en-es';
      const targetLangName = isToSpanish ? "Spanish" : "English";
      const targetLangCode = isToSpanish ? "es" : "en";

      const systemPrompt = `You are a professional instant speech interpreter. Directly and faithfully translate the ENTIRE user speech into natural conversational ${targetLangName}. Translate all clauses and sentences completely without cutting off or omitting any words. Output ONLY the pure translated speech. Zero quotes, zero markdown, zero explanations.`;

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ parts: [{ text: originalSpeech }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: {
          temperature: 0.0,
          maxOutputTokens: 1000
        }
      };

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: activeAbortController.signal
        });

        if (!response.ok) {
          throw new Error(`API Error: ${response.status}`);
        }

        const data = await response.json();
        const translatedText = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";

        if (translatedText) {
          // Agregar registro al historial en orden top-to-bottom
          addExchangeToHistory(originalSpeech, translatedText, direction);
          
          // Reproducción inmediata con motor TTS optimizado
          speakTranslation(translatedText, targetLangCode);
        } else {
          showToast("Traducción vacía recibida", "ph-warning text-amber-400");
        }
      } catch (error) {
        if (error.name !== 'AbortError') {
          console.error("Translation Error:", error);
          showToast("Error en servicio de traducción", "ph-warning-octagon text-rose-400");
        }
      } finally {
        resetDockButtons();
      }
    }

    /**
     * Agrega un bloque de diálogo al historial garantizando la clase .strict-font-12
     */
    function addExchangeToHistory(originalText, translatedText, direction) {
      if (emptyStateNotice) {
        emptyStateNotice.classList.add('hidden');
      }

      const isEngToSpa = direction === 'en-es';
      const originalBadgeColor = isEngToSpa ? "bg-blue-500/20 text-blue-300 border-blue-500/30" : "bg-emerald-500/20 text-emerald-300 border-emerald-500/30";
      const originalBadgeText = isEngToSpa ? "ENG (HABLADO)" : "SPA (HABLADO)";

      const transBadgeColor = isEngToSpa ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/30" : "bg-blue-500/20 text-blue-300 border-blue-500/30";
      const transBadgeText = isEngToSpa ? "SPA (TRADUCCIÓN)" : "ENG (TRADUCCIÓN)";
      const targetLangPrefix = isEngToSpa ? "es" : "en";

      const card = document.createElement('div');
      card.className = "w-full rounded-xl bg-slate-900/90 border border-slate-800 p-3 shadow-md space-y-2.5 transition-all hover:border-slate-700/80";

      // Fila 1: Texto Hablado Original
      const originalRow = document.createElement('div');
      originalRow.className = "space-y-1";
      originalRow.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-[9px] font-bold px-1.5 py-0.5 rounded border ${originalBadgeColor} tracking-wide">
            ${originalBadgeText}
          </span>
          <button class="btn-copy-orig p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition-colors" title="Copiar original">
            <i class="ph ph-copy text-xs"></i>
          </button>
        </div>
        <p class="strict-font-12 text-slate-300 font-normal break-words">${escapeHTML(originalText)}</p>
      `;

      // Separador sutil
      const divider = document.createElement('div');
      divider.className = "w-full border-t border-slate-800/80";

      // Fila 2: Texto Traducido
      const transRow = document.createElement('div');
      transRow.className = "space-y-1";
      transRow.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-[9px] font-bold px-1.5 py-0.5 rounded border ${transBadgeColor} tracking-wide">
            ${transBadgeText}
          </span>
          <div class="flex items-center gap-1">
            <button class="btn-copy-trans px-1.5 py-0.5 rounded bg-slate-800/80 hover:bg-slate-750 text-slate-300 text-[10px] flex items-center gap-1 transition-colors" title="Copiar traducción">
              <i class="ph ph-copy text-[11px]"></i>
              <span>Copiar</span>
            </button>
            <button class="btn-listen-trans px-2 py-0.5 rounded bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/30 text-indigo-300 text-[10px] font-semibold flex items-center gap-1 transition-all" title="Escuchar traducción">
              <i class="ph-bold ph-speaker-high text-[11px]"></i>
              <span>Oír</span>
            </button>
          </div>
        </div>
        <p class="strict-font-12 text-slate-100 font-semibold break-words">${escapeHTML(translatedText)}</p>
      `;

      card.appendChild(originalRow);
      card.appendChild(divider);
      card.appendChild(transRow);

      // Eventos de botones interactivos
      const btnCopyOrig = card.querySelector('.btn-copy-orig');
      btnCopyOrig.addEventListener('click', () => {
        copySafe(originalText, btnCopyOrig);
      });

      const btnCopyTrans = card.querySelector('.btn-copy-trans');
      btnCopyTrans.addEventListener('click', () => {
        copySafe(translatedText, btnCopyTrans);
      });

      const btnListenTrans = card.querySelector('.btn-listen-trans');
      btnListenTrans.addEventListener('click', () => {
        playMicroFeedback(520, 0.05);
        speakTranslation(translatedText, targetLangPrefix);
      });

      // Las interacciones más recientes aparecen ARRIBA de las anteriores.
      // insertBefore mantiene el orden cronológico visual: nueva arriba, antiguas abajo.
      conversationStream.insertBefore(card, conversationStream.firstChild);

      // Mostrar inmediatamente la interacción más reciente.
      requestAnimationFrame(() => {
        transcriptScrollContainer.scrollTop = 0;
      });
    }

    /**
     * Copia segura de texto compatible con restricciones de iframes mediante fallback execCommand
     */
    function copySafe(text, triggerBtn) {
      const tempArea = document.createElement('textarea');
      tempArea.value = text;
      tempArea.style.position = 'fixed';
      tempArea.style.top = '-9999px';
      tempArea.style.left = '-9999px';
      tempArea.style.opacity = '0';
      document.body.appendChild(tempArea);
      tempArea.focus();
      tempArea.select();
      
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showToast("Texto copiado al portapapeles", "ph-check text-emerald-400");
          if (triggerBtn) {
            const originalHTML = triggerBtn.innerHTML;
            triggerBtn.innerHTML = `<i class="ph ph-check text-emerald-400 text-xs"></i>`;
            setTimeout(() => { triggerBtn.innerHTML = originalHTML; }, 1200);
          }
        }
      } catch (err) {
        console.error("Error al copiar:", err);
      }
      document.body.removeChild(tempArea);
    }

    /**
     * Muestra notificaciones tipo Toast
     */
    let toastTimeout = null;
    function showToast(text, iconClass) {
      clearTimeout(toastTimeout);
      toastMsg.textContent = text;
      toastIcon.className = `ph ${iconClass}`;
      appToast.classList.remove('opacity-0', 'pointer-events-none');
      appToast.classList.add('opacity-100');

      toastTimeout = setTimeout(() => {
        appToast.classList.remove('opacity-100');
        appToast.classList.add('opacity-0', 'pointer-events-none');
      }, 2200);
    }

    /**
     * Desplazamiento fluido hacia abajo
     */
    function scrollToBottom() {
      requestAnimationFrame(() => {
        transcriptScrollContainer.scrollTop = transcriptScrollContainer.scrollHeight;
      });
    }

    /**
     * Sanitización simple para inserción HTML
     */
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    /**
     * Asignación de controladores de eventos para los botones del Dock
     */
    btnStart.addEventListener('click', () => {
      unlockAudioSubsystem();
      
      // Limpiar historial actual
      conversationStream.innerHTML = "";
      if (emptyStateNotice) {
        emptyStateNotice.classList.remove('hidden');
      }
      
      // IMPORTANTE: en esta versión conservamos el texto visible después de STOP.
      // Los buffers se limpian únicamente para la próxima sesión, no la tarjeta.
      completedChunks = [];
      currentSessionFinalText = "";
      currentSessionInterimText = "";
      
      showToast("Historial limpio y audio listo", "ph-trash text-indigo-400");
    });

    btnEngSpa.addEventListener('click', () => {
      // Regla: No se puede tocar un botón mientras el otro está activo
      if (isUserListening && activeDirection === 'es-en') return;

      if (!isUserListening) {
        startListening('en-es');
      } else {
        stopListeningAndTranslate();
      }
    });

    btnSpaEng.addEventListener('click', () => {
      // Regla: No se puede tocar un botón mientras el otro está activo
      if (isUserListening && activeDirection === 'en-es') return;

      if (!isUserListening) {
        startListening('es-en');
      } else {
        stopListeningAndTranslate();
      }
    });

    // Cargar voces en cuanto estén disponibles
    window.addEventListener('load', () => {
      loadVoices();
    });
  </script>
</body>
